esphome:
    name: airfryergiga
    friendly_name: AirFryerGiga
    on_boot:
        priority: -10
        then:
            -   climate.control:
                    id: heater_pid
                    mode: "OFF"

esp32:
    board: esp32-c3-devkitm-1
    framework:
        type: arduino

# Enable logging
logger:
    level: INFO

web_server:
    port: 80

# Enable Home Assistant API
api:
    encryption:
        key: "QcAEDqWBE5+a54K05lTA758DqFT22hFX0pjWSj0PnSI="

ota:
    -   platform: esphome
        password: "e23d08bd1139cf9a569618494aa8ccc2"

wifi:
    ssid: !secret wifi_ssid
    password: !secret wifi_password

    # Enable fallback hotspot (captive portal) in case wifi connection fails
    ap:
        ssid: "Airfryergiga Fallback Hotspot"
        password: "rasejTdp0N1I"

captive_portal:

external_components:
    # equivalent shorthand for GitHub
    -   source: github://kaminaris/esphome-external-component-examples@d0ced0a3d11e5808571e7f6c730ffa50d71741f0
        components: [ passthru_float_output ]

number:
    -   platform: template
        name: "Duration (Minutes)"
        id: timer_duration
        min_value: 0
        max_value: 360  # Set the maximum to 6 hours (360 minutes)
        step: 10
        unit_of_measurement: "min"
        mode: slider  # Can be a slider for easy adjustments in Home Assistant
        optimistic: true  # Stores value even when not connected to the system

switch:
    -   platform: template
        id: fan_switch
        name: "Fan Switch"
        optimistic: True
        turn_on_action:
            then:
                -   lambda:
                        id(ac_fan).set_level(0.55);
        turn_off_action:
            then:
                -   lambda:
                        id(ac_fan).set_level(0);
                        id(ac_fan).turn_off();
globals:
    - id: start_time
      type: unsigned long
      restore_value: false

script:
    # Script to handle the timer logic
    -   id: heater_fan_timer_script
        mode: single
        then:
            -   climate.control:
                    id: heater_pid
                    mode: "HEAT"
            -   switch.turn_on: fan_switch
            -   logger.log:
                    format: "Heater and fan turned ON. Timer started."
                    level: INFO
            -   lambda: |-
                    id(start_time) = millis();
            -   delay: !lambda 'return id(timer_duration).state * 60 * 1000;'
            -   climate.control:
                    id: heater_pid
                    mode: "OFF"
            -   switch.turn_off: fan_switch
            -   lambda: |-
                    id(start_time) = 0;
            -   logger.log:
                    format: "Heater and fan turned OFF after timer expired."
                    level: INFO
interval:
    -   interval: 60s
        then:
            -   lambda: |-
                    if (id(start_time) > 0) {
                        unsigned long elapsed_time = millis() - id(start_time);
                        int remaining_time = (id(timer_duration).state * 60 * 1000 - elapsed_time) / 60000;  // Remaining time in minutes
                        id(time_remaining).publish_state(remaining_time);  // Update remaining time
                        ESP_LOGI("main", "Time remaining: %d minutes", remaining_time);
                    }

button:
    -   platform: template
        name: "Stop Timer"
        on_press:
            then:
                -   script.stop: heater_fan_timer_script
                -   climate.control:
                        id: heater_pid
                        mode: "OFF"
                -   switch.turn_off: fan_switch
                -   logger.log: "Timer manually stopped and devices turned OFF."

    -   platform: template
        name: "Start heating"
        on_press:
            then:
                -   script.execute: heater_fan_timer_script
                -   logger.log: "Timer manually stopped and devices turned OFF."
climate:
    -   platform: pid
        name: "Air Fryer"
        sensor: main_temp
        id: heater_pid
        default_target_temperature: 0°C
        visual:
            min_temperature: 10
            max_temperature: 180
        heat_output: heat_output_redirect
        #heat_output: ac_heater
        on_state:
            then:
                -   lambda: |-
                        auto pidO = id(heat_output_redirect).valx;
                        auto pidX = id(heater_pid).get_output_value();
                        float temp_diff = id(heater_pid).target_temperature - id(main_temp).state;
                        if (temp_diff > 20) {
                          //pidO = 1.0; 
                        } else if (temp_diff > 0) {
                          pidO = pidO * (temp_diff / 20.0); 
                        } else {
                          pidO = 0.0;
                        }
                        //ESP_LOGI("PID", "%.4f, %.4f, %.4f, %.4f", pidX, pidO, id(main_temp).state, temp_diff);
                        id(ac_heater).set_level(pidO);
        control_parameters:
            kp: 0.5
            ki: 0.0
            kd: 0.01
            output_averaging_samples: 1      # smooth the output over 5 samples
            derivative_averaging_samples: 1  # smooth the derivative value over 10 samples
        deadband_parameters:
            threshold_high: 0.1°C       # deadband within +/-0.5°C of target_temperature
            threshold_low: -0.1°C

spi:
    miso_pin: GPIO5
    clk_pin: GPIO19

sensor:
    -   platform: template
        name: "Time Remaining (Minutes)"
        id: time_remaining
        unit_of_measurement: "min"
        update_interval: 60s  # Update every 60 seconds

    -   platform: max6675
        id: main_temp
        name: "Temperature"
        cs_pin: GPIO2
        update_interval: 1s

output:
    -   platform: passthru_float_output
        id: heat_output_redirect

    -   platform: ac_dimmer
        id: ac_fan
        gate_pin: GPIO4
        method: LEADING
        zero_cross_pin:
            number: GPIO6
            allow_other_uses: true
            mode:
                input: true
            inverted: yes

    -   platform: ac_dimmer
        id: ac_heater
        gate_pin: GPIO3
        max_power: 0.5
        zero_cross_pin:
            number: GPIO6
            allow_other_uses: true
            mode:
                input: true
            inverted: yes
light:
    -   platform: monochromatic
        output: ac_heater
        name: Heater

    -   platform: monochromatic
        output: ac_fan
        name: Fan
